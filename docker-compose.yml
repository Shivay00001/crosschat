services:
  app:
    build: .
    ports:
      - "8005:8005"
    environment:
      - CROSSCHAT_DB=/app/data/crosschat.db
    volumes:
      - chat_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  chat_data:
